<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orlo Recommender" />
    <meta property="og:description" content="Explainable product suggestions, built on synthetic data." />
    <meta property="og:image" content="https://orlo-recommender.onrender.com/img/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Product | Orlo Recommender</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/pages/product.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page">
      <div data-product></div>

      <div data-sections hidden>
        <section class="section" aria-labelledby="similar-title">
          <h2 id="similar-title" class="section__title" data-i18n="product.similar"></h2>
          <div class="product-grid" data-similar aria-live="polite"></div>
        </section>

        <section class="section" aria-labelledby="look-title">
          <h2 id="look-title" class="section__title" data-i18n="product.look"></h2>
          <div class="product-grid" data-look></div>
        </section>

        <aside class="history history--wide" data-history></aside>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
